name: Vercel Production Deployment
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
on:
  push:
    branches:
      - main
      - dev
      - dev-dalton
      - dev-justin

jobs:
  Deploy-Production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --scope=swinneyjs-projects --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --scope=swinneyjs-projects --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project to Vercel
        run: vercel deploy --prebuilt --prod --scope=swinneyjs-projects --token=${{ secrets.VERCEL_TOKEN }} | tee deploy_url.txt

      - name: Smoke test deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          DEPLOY_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.vercel\.app' deploy_url.txt | tail -1)
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::Could not determine deployment URL from Vercel output"
            exit 1
          fi

          # Unique deployment URLs sit behind Vercel Deployment Protection (SSO
          # redirect). Resolve the deployment's public production alias via the
          # Vercel API and smoke-test that instead.
          DEPLOY_ID=$(echo "$DEPLOY_URL" | sed -E 's#https://([^.]+)\.vercel\.app#\1#')
          TARGET_URL="$DEPLOY_URL"
          ALIAS_JSON=$(curl -s --max-time 20 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$DEPLOY_ID?teamId=$VERCEL_ORG_ID" || true)
          alias_paths=$(echo "$ALIAS_JSON" | python3 -c "import json,sys; print(' '.join(json.load(sys.stdin).get('alias', [])))" 2>/dev/null || true)
          for candidate in $alias_paths; do
            case "$candidate" in
              http*) TARGET_URL="$candidate"; break ;;
            esac
          done
          if [ "$TARGET_URL" = "$DEPLOY_URL" ]; then
            echo "::warning::No public alias resolved; testing deployment URL directly (may hit SSO redirect)"
          fi

          echo "Smoke testing $TARGET_URL/api/health"
          STATUS=000
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$TARGET_URL/api/health" || true)
            if [ "$STATUS" = "200" ]; then
              break
            fi
            echo "Attempt $i: /api/health returned $STATUS, retrying in 10s..."
            sleep 10
          done
          if [ "$STATUS" != "200" ]; then
            echo "::error::Smoke test failed: /api/health returned $STATUS after 10 attempts"
            exit 1
          fi
          BODY=$(curl -s --max-time 15 "$TARGET_URL/api/health")
          echo "Smoke test passed: /api/health returned 200 ($BODY)"
