# Scenario B — On-Premises Kubernetes (OpenShift / RKE2 / bare-metal).
#
# Zero application code changes. Two deltas over the base manifests:
#   1. PostgreSQL binds the host-encrypted StorageClass below. Encryption is
#      provided by Linux LUKS/dm-crypt at the host/device layer (the
#      `encrypted: "true"` parameter records the requirement; the actual
#      cipher lives on the provisioned nodes, verified by infra, not by K8s).
#   2. Ingress annotations if the cluster does not run ingress-nginx: keep the
#      header-strip control, translated to the local controller (examples in
#      comments below — only ONE block applies).
#
# Bind:
#   kubectl apply -f k8s/adapters/scenario-b-onprem.yaml
#   kubectl patch statefulset soc-postgres \
#     --type=json -p='[{"op":"replace","path":"/spec/volumeClaimTemplates/0/spec/storageClassName","value":"host-encrypted-luks"}]'
#
# Ingress alternatives (replace the nginx annotations on k8s/ingress-nginx.yaml):
#   Traefik (strip inbound identity headers via middleware):
#     traefik.ingress.kubernetes.io/router.middlewares: "soc-strip-headers@kubernetescrd"
#     # + a Middleware CRD: headers.customRequestHeaders.X-Auth-Request-User: ""
#   HAProxy ingress:
#     haproxy.org/request-set-header: "X-Auth-Request-User "
#   OpenShift route (no NGINX snippet support): terminate at a sidecar oauth-proxy
#     Deployment in front of soc-api and strip there; keep the NetworkPolicy as-is.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: host-encrypted-luks
provisioner: local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
parameters:
  encrypted: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: soc-api-config
  labels:
    app: soc-api
data:
  AUTH_MODE: proxy_header
  SOC_PROXY_USER_HEADER: X-Auth-Request-User
  SOC_TRUSTED_PROXY_CIDRS: 10.0.0.0/8
  SESSION_SECURE: "1"
  RATE_LIMIT_PER_MIN: "30"
